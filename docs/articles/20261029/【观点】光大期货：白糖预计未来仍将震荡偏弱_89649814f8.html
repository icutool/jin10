      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>原糖方面，市场基本消化了巴西大选的影响，未来将逐渐回归基本面。北半球特别是印度的估产至关重要，需关注后续压榨进度，对原糖价格暂不过于悲观。国内方面，陈糖仍在压制市场表现，未来市场关注的核心在于本榨季估产。近期广西持续偏旱，市场对产量看法分歧较大。新糖即将上市，预计未来白糖仍将震荡偏弱。</p></div></div>
