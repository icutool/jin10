        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>5月13日（周三），农业咨询机构 Safras &amp; Mercado 周三表示，预计巴西2025/26年度棉花产量为374万吨，低于其此前预估的376万吨。国内，纺织亏损加剧，开机率降低，但终端库存较低。进口量同比增加，内外价差较大。棉花利空逐渐汇聚，多空交织，棉花震荡等待新的指引。</p></div></div>
