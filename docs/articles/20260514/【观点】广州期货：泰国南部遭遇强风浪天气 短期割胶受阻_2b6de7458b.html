        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>近期泰国南部遭遇较大风浪天气，短期割胶作业受影响。下游方面，部分轮胎企业存3-7天检修安排，带动上周整体产能利用率下滑较大，关注本周轮胎开工和成品库存情况。目前市场担忧5月全球可能发生的厄尔尼诺气候将对橡胶产出有影响，总体支撑胶价偏强运行。</p></div></div>
