        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>9月14日（周一），巴基斯坦经济协调委员会批准出口20万吨糖。该决定是在国家粮食安全部提交相关申请后作出的。国内本榨季产量超过1200万吨，为国内市场提供了充沛供应，仓单数量巨大，09合约结束后压力转移至01合约。若失去国际糖价上行指引，国内郑糖承压。</p></div></div>
