        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>受原料供应紧张和炼厂生产利润不佳的双重挤压国内炼厂排产意愿极低。5月国内沥青计划排产量预计将创下近年来的单月新低，供应端的持续收缩为价格提供了一定的底部支撑。下游北方地区的道路施工项目复工节奏缓慢，南方降雨天气频繁，持续拖累道路施工进展。短期沥青价格随地缘政治变化为主。</p></div></div>
