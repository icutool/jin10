        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>7月16日（周四），巴基斯坦糖厂协会( PSMA ）向联邦政府申请即刻批准出口60万吨过剩的糖供应，称此举能够创造可观外汇收入，同时缓解国内库存积压压力。国内本榨季1300万吨的产量为国内提供了充沛供应，现货价格走势疲弱，糖价区间内弱势震荡。</p></div></div>
