      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>油脂：节前油脂偏弱震荡，目前高频数据显示马来西亚6月1-15日出口量环比上升，产地需求数据边际改善，给棕榈油价格提供一定支撑。且印尼 B50强制掺混政策即将落地，价格底部支撑仍在。但由于原油价格回落拖累油脂行情，且目前油脂缺乏明显利多驱动，预计短期继续震荡调整为主。</p></div></div>
