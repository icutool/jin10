        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>白糖：郑糖主力隔夜再度下探。目前仍处于巴西糖压榨高峰期，且目前巴西乙醇折糖价为13美分/磅左右，低价醇对糖价有所拖累，从而压制国际糖价。国内方面，库存压力较大、叠加国际糖价持续走弱，近期5月份进口糖和进口糖浆预拌粉量仍较大，预计国内糖价上方压力较大，偏弱运行为主。</p></div></div>
