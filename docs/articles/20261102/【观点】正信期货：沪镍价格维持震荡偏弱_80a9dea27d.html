        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>维持震荡偏弱，关注27年配额计划</p><p>沪镍价格维持震荡偏弱，上周五夜盘收115380元/吨；LME镍价格回落，上周五跌幅1.9%，收15220美元/吨。</p><p>总的来看，国外冶炼厂有计划减产倾向但实际减产仍待验证，同时考虑到下游需求温和修复但总体不及预期的情况下，镍维持震荡偏弱走势，产业需求可按需采买。</p></div></div>
