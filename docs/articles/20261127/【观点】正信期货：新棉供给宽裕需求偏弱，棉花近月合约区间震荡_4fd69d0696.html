        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>感恩节外盘休市，国内棉价供需博弈延续</p><p>周四外盘休市。</p><p>整体看：外盘因感恩节假期休市。国内新棉供给宽裕，叠加需求偏弱，价格反弹高度受限。成本和偏低的仓单形成下方支撑。01合约交割逻辑占比提升，近月合约区间震荡，或存震荡反复概率。重点跟踪下游承接与外部政策变化。</p></div></div>
