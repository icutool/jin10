      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>5月27日（周三），巴西航运机构 Williams 发布的数据显示，截至5月27日当周，巴西港口等待装运食糖的船只数量为64艘，此前一周为51艘。国内，旧季超预期丰产的产量转化为高企的库存施压于白糖，糖价走弱，但考虑未来供需格局和国际糖价成本，糖价下方空间同样受限。预计维持区间震荡格局。</p></div></div>
