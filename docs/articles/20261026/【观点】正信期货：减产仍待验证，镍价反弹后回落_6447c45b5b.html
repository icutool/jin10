      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>沪镍价格近期反弹后回落，上周五收于120130元/吨；LME镍价回落，上周五下跌0.81%，收于15865美元/吨。</p><p>总体来看，冶炼厂有计划减产的倾向，但实际减产仍待验证。下游需求温和修复，但总体不及预期，短期镍价或围绕供给扰动展开博弈。产业端可按需采购，并在价格反弹时做好套期保值。</p></div></div>
