        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>马来西亚棕榈油协会（ MPOA ）公布的数据显示，马来西亚5月1-20日毛棕榈油产量较上月同期减少2.19%。受原油价格走低，食用油出口需求减少等影响，马棕走势偏弱。但厄尔尼诺现象影响下印尼和马来天气较为干旱，或影响棕榈油产量。预计本日油脂温和震荡。</p></div></div>
