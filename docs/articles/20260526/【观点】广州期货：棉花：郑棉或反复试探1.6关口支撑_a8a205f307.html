      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>5月24日（周日），印度一位高级官员表示，政府目前正就原棉进口11％的关税问题进行"高级别磋商"，并正在研究是否可以取消这项征税，预计不久后将做出决定。国内，下游进入传统淡季，开机率降低，但终端原料和成品皆库存较低。进口量同比增加。棉价回落试探支撑，但下方空间有限。</p></div></div>
