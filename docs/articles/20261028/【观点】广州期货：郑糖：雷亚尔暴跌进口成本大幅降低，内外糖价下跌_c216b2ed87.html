        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>最大生产国巴西的本币雷亚尔在该国总统路易斯·伊纳西奥·卢拉·达席尔瓦出人意料赢得选举后暴跌。巴西糖进口成本受此影响大幅降低。国内，旧榨季1295万吨的产量为国内提供了充沛供应，高库存仍需时间消化。失去国际糖价支撑后郑糖承压走弱。</p></div></div>
