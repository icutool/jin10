        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>美国最新PPI数据强化9月加息预期，有色板块整体承压。基本面层面，当前沪锡基本面表现为矿端硬约束托底、需求稳健，整体维持紧平衡，价格高位震荡运行。供给端，缅甸佤邦复产仅恢复至前期40%-50%，锡矿和再生锡原料供应弹性不足，冶炼开工受约束，精锡产量难大幅释放，供应风险持续存在。</p></div></div>
