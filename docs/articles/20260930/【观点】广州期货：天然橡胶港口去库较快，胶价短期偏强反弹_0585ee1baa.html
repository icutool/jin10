      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed">近期泰国降水逐渐减少，但深色胶原料价格依旧偏强。下游方面，多家轮胎企业节前订单表现一般，开工回落。尽管需求一般，但港口去库速率依旧较快，全钢胎成品库存持续降至年内低位。胶价短期以偏强反弹为主，但需注意节前后下游轮胎需求阶段性走弱对价格上方的压制影响。</div></div>
