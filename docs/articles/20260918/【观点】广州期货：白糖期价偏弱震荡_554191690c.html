      </header>
      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>9月17日（周四），巴西农业部周四表示，8月下半月，该国中南部地区糖产量同比下降约4.8%，至372万吨，因糖厂将更多甘蔗用于生产乙醇。国内旧榨季超1200万吨的产量为国内提供了充沛供应，仓单数量巨大，09合约结束后压力转移至01合约。若失去国际糖价向上指引，国内郑糖承压。</p></div></div>
