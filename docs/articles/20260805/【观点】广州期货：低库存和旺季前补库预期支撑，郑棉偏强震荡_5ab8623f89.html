      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>巴西国家商品供应公司（Conab）公布的数据显示，截至2025年8月1日当周，巴西2025/26年度棉花收割率为28.4%，此前一周为16.5%，上年同期为29.7%，五年均值为67%。国内，棉花库存中低水平，金九银十旺季前的补库需求给予支撑，郑棉维持区间震荡走势。</p></div></div>
