      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>6月9日（周二），当地媒体援引乌克兰糖业协会负责人的话称，受种植面积缩减与天气状况不佳影响，乌克兰2026年白糖产量预计将下滑三分之一，降至约120万吨。国内，旧季超预期丰产的产量转化为高企的库存施压于白糖，但考虑未来供需格局和国际糖价成本，糖价下方空间同样受限。预计维持区间震荡格局。</p></div></div>
