        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>临近周末除泰国外，国内橡胶多个主产区延续高温少雨状态，影响割胶进程以及产胶量。下游方面，近期轮胎开工提升明显，但成品库存有所累积。目前市场担忧5月全球可能发生的厄尔尼诺气候将对橡胶产出有影响，总体支撑胶价。</p></div></div>
