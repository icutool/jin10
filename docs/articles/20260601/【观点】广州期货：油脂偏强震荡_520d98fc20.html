      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>船货检验机构 Intertek Testing Services （简称 ITS ）发布的数据显示，马来西亚5月棕榈油产品出口量为1,280,897吨，较上个月的1,404,618吨下降8.8%。厄尔尼诺现象影响下印尼和马来天气较为干旱，或影响棕榈油产量。叠加加拿大菜籽产区天气影响，预计本日油脂偏强震荡。</p></div></div>
