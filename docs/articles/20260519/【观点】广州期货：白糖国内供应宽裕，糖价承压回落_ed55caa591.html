      </header>
      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>国际糖业组织（ ISO ）预计，全球糖市场将在2026/27年度转为26.2万吨的短缺，这是该机构对新榨季的首次预测。国际白糖合约因糖醇比改变、成本增加和天气影响，亏损加剧导致加工厂产能出清等利多而得到支撑，低点已出。但国内广西和云南主产区超预期丰产，高企的库存限制白糖反弹空间。</p></div></div>
