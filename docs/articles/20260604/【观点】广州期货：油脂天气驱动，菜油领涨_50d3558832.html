      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>5月以来，加拿大菜籽春播遭遇复杂天气。前期低温湿冷导致播种窗口被迫推迟；5月下旬产区突遭热浪，土壤湿度快速下降，虽推进了播种，但刚出土的幼苗面临高温考验。美豆同样受天气影响，但国内原料处于进口累库阶段，油脂走势略有分化。</p></div></div>
