        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>11月25日（周三），印度政府周三将100万吨原糖免税进口的截止时间延后三个月，该关税配额（TRQ）项下进口有效期延长至2027年3月31日。国内新糖陆续上市，当前暂无大幅减产预期。供应增加，郑糖承压。但因新季国际供需格局大幅好转，强预期给予郑糖部分支撑。</p></div></div>
