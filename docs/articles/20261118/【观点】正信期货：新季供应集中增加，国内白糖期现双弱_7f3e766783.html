        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>新季供应集中增加，国内白糖期现双弱</p><p>国际方面，北半球榨季开启，多空交织，原糖震荡运行。截至10月30日，巴西中南部双周食糖产量为208万吨，同比减少0.7%。印度多主产邦已开榨，榨季同比提前，截至11月15日，累计产糖242.1万吨，同比增长55%。</p></div></div>
