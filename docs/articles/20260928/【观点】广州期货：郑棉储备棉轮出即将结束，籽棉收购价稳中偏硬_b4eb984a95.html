      </header>
      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed">中国储备棉管理有限公司定于2026年9月30日起停止2026年中央储备棉销售。截至停止销售日，合计轮出约43万吨，有效补充市场供应。新棉上市在即，供应阶段性宽松，但籽棉收购价稳中偏硬，对棉价形成较强支撑。当前即期纺织利润已修复，棉价下方空间受限。</div></div>
