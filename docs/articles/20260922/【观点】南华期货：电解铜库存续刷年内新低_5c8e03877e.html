      </header>
      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>【供需库存】1、国内电解铜现货库存（上海金属网，9月21日）：8.76万吨，较17日降0.58万吨，较14日降0.87万吨，续刷年内新低；其中上海5.53万吨、江苏2.10万吨、广东0.78万吨。国产到货偏少，进口铜受船只靠港延误影响补充不多，下游逢低采购补库，仓库出库尚可，库存持续下降。</p></div></div>
