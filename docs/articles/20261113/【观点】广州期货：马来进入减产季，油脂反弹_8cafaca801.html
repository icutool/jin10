      <article class="article-wrap">
        <div class="news-content article-content" id="" style="position:relative"><div class="news-content-parsed"><p>11月12日（周四），印尼棕榈油协会( GAPKI ）周四表示，今年1至9月，印尼棕榈油产品出口量达到2730万吨，较去年同期增长9.6%。当前油脂仍有厄尔尼诺现象，生物柴油掺混比例提升等天气和政策支撑，但宏观、高库存和弱消费等因素利空。预计区间宽幅震荡。</p></div></div>
